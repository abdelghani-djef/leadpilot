# LeadPilot on a small VPS, behind a shared Caddy gateway on the "web" network, which handles
# HTTPS for every app on the server. See deploy/README.md.
# The image is built on another machine and loaded with `docker load`, so the VPS never builds
# (a Next.js build needs more memory than a 512 MB server has).
services:
  leadpilot:
    image: leadpilot:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - leadpilot-data:/app/data
    networks:
      - web
    mem_limit: 300m

networks:
  web:
    external: true

volumes:
  leadpilot-data:
