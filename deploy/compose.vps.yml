# Production stack for a small VPS: LeadPilot behind Caddy, which gets HTTPS certificates itself.
# The image is built on another machine and loaded with `docker load`, so the VPS never builds
# (a Next.js build needs more memory than a 512 MB server has). See deploy/README.md.
services:
  leadpilot:
    image: leadpilot:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - leadpilot-data:/app/data
    mem_limit: 300m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - leadpilot
    mem_limit: 100m

volumes:
  leadpilot-data:
  caddy-data:
  caddy-config:
