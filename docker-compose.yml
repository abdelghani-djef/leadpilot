services:
  leadpilot:
    build:
      context: .
      args:
        NEXT_PUBLIC_CONTACT_URL: ${NEXT_PUBLIC_CONTACT_URL:-}
    restart: unless-stopped
    env_file: .env
    # Only reachable from the server itself; put Caddy or Nginx in front for HTTPS.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - leadpilot-data:/app/data

volumes:
  leadpilot-data:
